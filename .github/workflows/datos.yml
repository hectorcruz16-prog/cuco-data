name: Datos Cuco Fantasy
on:
  schedule:
    - cron: "17 10,22 * * *"   # 6:17 am y 6:17 pm hora de PR
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**", "requirements.txt"]
permissions:
  contents: write
concurrency: datos
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/scrape.py
      - name: Guardar si cambió
        run: |
          git config user.name "cuco-robot"
          git config user.email "cuco-robot@users.noreply.github.com"
          git add data/experts.json
          git diff --cached --quiet || git commit -m "datos $(date -u +%F' '%H:%M)" && git push
