name: Videos NBA (YouTube)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/yt.py", ".github/workflows/yt.yml"]
permissions:
  contents: write
concurrency: yt
jobs:
  yt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests==2.32.3
      - run: python scripts/yt.py
      - name: Despertar la app (avisos push, alineación, lesiones) — solo si existe el secreto CRON_KEY
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          if [ -n "$CRON_KEY" ]; then
            curl -s --max-time 50 "https://cucosdraft.pages.dev/api/cron?k=$CRON_KEY" | head -c 400; echo
          else
            echo "sin CRON_KEY: no se llama al cron"
          fi
      - name: Guardar si hay videos nuevos
        run: |
          git config user.name "cuco-robot"
          git config user.email "cuco-robot@users.noreply.github.com"
          git add data/yt.json
          if ! git diff --cached --quiet; then
            git commit -m "videos $(date -u +%H:%M)"
            git pull --rebase -q origin main || true
            git push
          fi
